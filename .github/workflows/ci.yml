name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Webview interaction tests (headless Chrome)
        run: npm run test:webview
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Package VSIX (not published)
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist-vsix/*.vsix
          retention-days: 7

  # The marketing site (opencodesidecar.com): its own checks. It is never packaged into the VSIX.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
